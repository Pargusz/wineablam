<title>Ablama Bir Gül</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Great+Vibes&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #0a0509;
    --plum: #2a0f1c;
    --blush: #f6dde0;
    --rose-glow: rgba(255, 90, 120, .35);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--blush);
    overflow: hidden;
    padding-inline: 16px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
  }
  .line {
    position: fixed;
    left: 16px;
    right: 16px;
    margin: 0;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translateY(14px);
    filter: blur(8px);
    transition: opacity 2.4s ease, transform 2.4s ease, filter 2.4s ease;
    text-wrap: balance;
  }
  .line.show { opacity: 1; transform: none; filter: blur(0); }
  .top {
    top: calc(env(safe-area-inset-top, 0px) + clamp(28px, 8vh, 80px));
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.45rem, 5.2vw, 2.5rem);
    letter-spacing: .02em;
    color: var(--blush);
    text-shadow: 0 0 24px rgba(255, 120, 140, .25), 0 2px 10px rgba(0, 0, 0, .6);
  }
  .bottom {
    bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(28px, 8vh, 84px));
    font-family: "Great Vibes", "Snell Roundhand", "Brush Script MT", cursive;
    font-size: clamp(2.8rem, 11vw, 5rem);
    line-height: 1.1;
    color: #ffe9ec;
    text-shadow: 0 0 30px var(--rose-glow), 0 0 8px rgba(255, 150, 165, .35), 0 3px 14px rgba(0, 0, 0, .8);
  }
  .cuma {
    position: fixed;
    left: 50%;
    top: var(--cuma-y, 28%);
    max-width: calc(100% - 32px);
    transform: translate(-50%, -50%) scale(.85);
    opacity: 0;
    filter: blur(8px);
    transition: opacity 2s ease, transform 2s ease, filter 2s ease;
    pointer-events: none;
    perspective: 700px;
  }
  .cuma.show { opacity: 1; transform: translate(-50%, -50%); filter: blur(0); }
  .cuma .text {
    display: block;
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.7rem, 7vw, 2.8rem);
    letter-spacing: .03em;
    white-space: nowrap;
    color: #ff4d6d;
    background: linear-gradient(90deg, #ff0040, #ff8a00, #ffe600, #00ff6a, #00d5ff, #3d5bff, #c800ff, #ff0040) 0 0 / 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rgb 3s linear infinite, spin 4s linear infinite;
  }
  @keyframes rgb { to { background-position: 150% 0; } }
  @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .line, .cuma { transition: none; }
    .cuma .text { animation: rgb 3s linear infinite; }
  }
</style>

<canvas id="c" aria-hidden="true"></canvas>
<p class="line top" id="l1">Bunlar senin için ablam</p>
<div class="cuma" id="l3"><span class="text">Hayırlı Cumalar</span></div>
<p class="line bottom" id="l2">Özür dilerim</p>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const PI = Math.PI, TAU = PI * 2;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, DPR = 1;

  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const rnd = (a, b) => a + Math.random() * (b - a);

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    initAmbient();
  }

  // ---------- rose geometry ----------
  const rings = [
    { n: 5, L: 1.00, w: 1.00, th: 84 },
    { n: 5, L: 0.93, w: 0.95, th: 72 },
    { n: 5, L: 0.82, w: 0.90, th: 58 },
    { n: 4, L: 0.68, w: 0.88, th: 43 },
    { n: 4, L: 0.54, w: 0.85, th: 28 },
    { n: 3, L: 0.42, w: 0.85, th: 15 },
    { n: 3, L: 0.30, w: 0.90, th: 7 }
  ];
  const parts = [];
  rings.forEach((r, k) => {
    for (let j = 0; j < r.n; j++) {
      parts.push({
        kind: 'petal', k,
        a: j * TAU / r.n + k * 0.71 + rnd(-.15, .15),
        L: r.L * rnd(.94, 1.05),
        w: r.w * rnd(.92, 1.06),
        th: r.th * PI / 180 + rnd(-.06, .06),
        ph: rnd(0, TAU)
      });
    }
  });
  for (let j = 0; j < 5; j++) {
    parts.push({ kind: 'sepal', k: -1, a: j * TAU / 5 + 0.3, L: 0.72, w: 0.26, th: 0, ph: rnd(0, TAU) });
  }

  const PHI = 0.62; // viewing elevation
  const sP = Math.sin(PHI), cP = Math.cos(PHI);
  const proj = (X, Y, Z) => ({ x: X, y: Y * sP - Z * cP, z: Y * cP + Z * sP });
  const LIGHT = (() => { const v = [-0.45, 0.55, 0.75]; const m = Math.hypot(...v); return v.map(x => x / m); })();

  const ROSE = { base: [48, 2, 12], mid: [150, 8, 34], edge: [206, 34, 60] };
  const rgb = (c, m, a = 1) => `rgba(${Math.min(255, c[0] * m) | 0},${Math.min(255, c[1] * m) | 0},${Math.min(255, c[2] * m) | 0},${a})`;

  function petalPath() {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-0.55, 0.12, -1.08, 0.55, -0.74, 0.93);
    ctx.quadraticCurveTo(-0.34, 1.12, 0, 1.0);
    ctx.quadraticCurveTo(0.34, 1.12, 0.74, 0.93);
    ctx.bezierCurveTo(1.08, 0.55, 0.55, 0.12, 0, 0);
    ctx.closePath();
  }
  function sepalPath() {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-0.9, 0.25, -0.5, 0.7, 0, 1);
    ctx.bezierCurveTo(0.5, 0.7, 0.9, 0.25, 0, 0);
    ctx.closePath();
  }

  function fillPetal(b, back) {
    const g = ctx.createLinearGradient(0, 0, 0, 1);
    const tint = back ? 1.18 : 1;
    g.addColorStop(0, rgb(ROSE.base, b * 0.7));
    g.addColorStop(0.45, rgb(ROSE.mid, b * tint));
    g.addColorStop(0.88, rgb(ROSE.edge, b * tint));
    g.addColorStop(1, rgb([236, 84, 100], b * tint));
    ctx.fillStyle = g;
    petalPath(); ctx.fill();
    const s = ctx.createRadialGradient(0, 0.05, 0, 0, 0.05, 0.75);
    s.addColorStop(0, 'rgba(18,0,6,0.55)');
    s.addColorStop(1, 'rgba(18,0,6,0)');
    ctx.fillStyle = s; ctx.fill();
    const hl = ctx.createLinearGradient(-1, 0, 1, 0);
    hl.addColorStop(0, 'rgba(255,170,180,0)');
    hl.addColorStop(0.3, `rgba(255,170,180,${0.12 * b})`);
    hl.addColorStop(0.5, 'rgba(255,170,180,0)');
    hl.addColorStop(1, 'rgba(40,0,10,0.25)');
    ctx.fillStyle = hl; ctx.fill();
  }

  function drawRose(cx, cy, R, bloom, t) {
    const items = [];
    for (const p of parts) {
      let th, L = p.L * R, wl, bx = 0, by = 0, bz = 0;
      if (p.kind === 'petal') {
        const bp = easeInOut(clamp((bloom - p.k * 0.07) / 0.58));
        th = lerp(0.1 + p.k * 0.004, p.th, bp) + Math.sin(t * 0.9 + p.ph) * 0.02 * bp;
        L *= lerp(0.82, 1, bp);
        wl = p.w * L;
        const r0 = R * 0.07 * (1 - p.k / 7) * (0.4 + 0.6 * bp);
        bx = Math.cos(p.a) * r0; by = Math.sin(p.a) * r0;
        bz = -R * 0.16 * (1 - p.k / 6) * bp;
      } else {
        const bp = easeOut(clamp(bloom / 0.55));
        th = lerp(0.35, 1.95, bp) + Math.sin(t + p.ph) * 0.02;
        wl = p.w * R;
        bz = -R * 0.1;
      }
      const sa = Math.sin(p.a), ca = Math.cos(p.a);
      const d = [Math.sin(th) * ca, Math.sin(th) * sa, Math.cos(th)];
      const tg = [-sa, ca, 0];
      const n = [d[1] * tg[2] - d[2] * tg[1], d[2] * tg[0] - d[0] * tg[2], d[0] * tg[1] - d[1] * tg[0]];
      const o = proj(bx, by, bz);
      const v = proj(d[0] * L, d[1] * L, d[2] * L);
      const u = proj(tg[0] * wl / 2, tg[1] * wl / 2, 0);
      const mid = proj(bx + d[0] * L * 0.5, by + d[1] * L * 0.5, bz + d[2] * L * 0.5);
      const lit = n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2];
      const facing = n[1] * cP + n[2] * sP;
      items.push({ p, o, u, v, z: mid.z, lit, facing });
    }
    items.sort((a, b) => a.z - b.z);

    // receptacle
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const rc = proj(0, 0, -R * 0.14);
    const rg = ctx.createRadialGradient(cx + rc.x - R * 0.05, cy + rc.y - R * 0.05, 0, cx + rc.x, cy + rc.y, R * 0.2);
    rg.addColorStop(0, '#4d7a35'); rg.addColorStop(1, '#1b3a19');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.ellipse(cx + rc.x, cy + rc.y, R * 0.16, R * 0.14, 0, 0, TAU); ctx.fill();

    for (const it of items) {
      const { u, v, o } = it;
      if (Math.abs(u.x * v.y - u.y * v.x) < 0.05) continue;
      ctx.setTransform(DPR * u.x, DPR * u.y, DPR * v.x, DPR * v.y, DPR * (cx + o.x), DPR * (cy + o.y));
      if (it.p.kind === 'petal') {
        const occl = 1 - it.p.k * 0.055;
        const b = (0.42 + 0.68 * Math.abs(it.lit)) * occl;
        fillPetal(b, it.facing < 0);
      } else {
        const b = 0.55 + 0.6 * Math.abs(it.lit);
        const g = ctx.createLinearGradient(0, 0, 0, 1);
        g.addColorStop(0, rgb([40, 80, 34], b));
        g.addColorStop(1, rgb([78, 128, 58], b));
        ctx.fillStyle = g; sepalPath(); ctx.fill();
      }
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // ---------- stem & leaves ----------
  function bez(P, u) {
    const m = 1 - u;
    return {
      x: m * m * m * P[0].x + 3 * m * m * u * P[1].x + 3 * m * u * u * P[2].x + u * u * u * P[3].x,
      y: m * m * m * P[0].y + 3 * m * m * u * P[1].y + 3 * m * u * u * P[2].y + u * u * u * P[3].y
    };
  }
  function bezTan(P, u) {
    const m = 1 - u;
    const x = 3 * m * m * (P[1].x - P[0].x) + 6 * m * u * (P[2].x - P[1].x) + 3 * u * u * (P[3].x - P[2].x);
    const y = 3 * m * m * (P[1].y - P[0].y) + 6 * m * u * (P[2].y - P[1].y) + 3 * u * u * (P[3].y - P[2].y);
    return Math.atan2(y, x);
  }

  function drawStem(P, prog, R) {
    const N = 80, end = prog;
    const sw = Math.max(3, R * 0.075);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const path = () => {
      ctx.beginPath();
      for (let i = 0; i <= N; i++) {
        const q = bez(P, end * i / N);
        i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
      }
    };
    path(); ctx.strokeStyle = '#132a13'; ctx.lineWidth = sw * 1.25; ctx.stroke();
    path(); ctx.strokeStyle = '#2b5226'; ctx.lineWidth = sw; ctx.stroke();
    ctx.save(); ctx.translate(-sw * 0.22, 0);
    path(); ctx.strokeStyle = 'rgba(150,200,110,0.28)'; ctx.lineWidth = sw * 0.3; ctx.stroke();
    ctx.restore();
    // thorns
    [[0.18, 1], [0.37, -1], [0.56, 1], [0.74, -1]].forEach(([s, side]) => {
      if (prog < s + 0.03) return;
      const q = bez(P, s), a = bezTan(P, s);
      const nx = Math.cos(a + side * PI / 2), ny = Math.sin(a + side * PI / 2);
      const tx = Math.cos(a), ty = Math.sin(a);
      const k = sw * 1.1;
      ctx.beginPath();
      ctx.moveTo(q.x - tx * k * 0.6, q.y - ty * k * 0.6);
      ctx.quadraticCurveTo(q.x + nx * k * 0.6, q.y + ny * k * 0.6, q.x + nx * k * 1.2 + tx * k * 0.9, q.y + ny * k * 1.2 + ty * k * 0.9);
      ctx.lineTo(q.x + tx * k * 0.5, q.y + ty * k * 0.5);
      ctx.closePath();
      ctx.fillStyle = '#5a3a24'; ctx.fill();
    });
  }

  function drawLeaf(x, y, ang, len, wid, lp) {
    if (lp <= 0) return;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang); ctx.scale(lp, lp);
    ctx.strokeStyle = '#1f3d1b'; ctx.lineWidth = wid * 0.14; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len * 0.16, 0); ctx.stroke();
    ctx.translate(len * 0.14, 0);
    const L = len, w = wid * (0.2 + 0.8 * lp);
    const g = ctx.createLinearGradient(0, -w, 0, w);
    g.addColorStop(0, '#5b9443'); g.addColorStop(0.48, '#2f6027'); g.addColorStop(0.52, '#244d20'); g.addColorStop(1, '#10280f');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    // gently serrated edge
    const teeth = 9;
    for (let i = 1; i <= teeth; i++) {
      const u = i / teeth;
      const ew = Math.sin(PI * Math.pow(u, 0.75)) * w;
      const pu = (i - 0.5) / teeth;
      const pw = Math.sin(PI * Math.pow(pu, 0.75)) * w * 0.94;
      ctx.quadraticCurveTo(L * pu, -pw, L * u, -ew * (i === teeth ? 0 : 1));
    }
    for (let i = teeth - 1; i >= 0; i--) {
      const u = i / teeth;
      const ew = Math.sin(PI * Math.pow(u, 0.75)) * w;
      const pu = (i + 0.5) / teeth;
      const pw = Math.sin(PI * Math.pow(pu, 0.75)) * w * 0.94;
      ctx.quadraticCurveTo(L * pu, pw, L * u, ew);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(180,220,140,0.35)'; ctx.lineWidth = Math.max(0.8, wid * 0.05);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(L * 0.5, -w * 0.06, L * 0.96, 0); ctx.stroke();
    ctx.strokeStyle = 'rgba(180,220,140,0.16)'; ctx.lineWidth = Math.max(0.6, wid * 0.03);
    for (let i = 1; i <= 5; i++) {
      const x0 = L * i / 6.6;
      const reach = Math.sin(PI * Math.pow((x0 + L * 0.16) / L, 0.75)) * w * 0.8;
      ctx.beginPath(); ctx.moveTo(x0, 0); ctx.quadraticCurveTo(x0 + L * 0.07, -reach * 0.55, x0 + L * 0.16, -reach); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x0, 0); ctx.quadraticCurveTo(x0 + L * 0.07, reach * 0.55, x0 + L * 0.16, reach); ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- ambience ----------
  let dust = [], bokeh = [], falling = [];
  function initAmbient() {
    const n = Math.round(clamp(W * H / 14000, 30, 90));
    dust = Array.from({ length: n }, () => ({
      x: rnd(0, W), y: rnd(0, H), r: rnd(0.5, 1.8), vy: rnd(-16, -5), vx: rnd(-4, 4), ph: rnd(0, TAU), sp: rnd(0.6, 1.8)
    }));
    bokeh = Array.from({ length: 9 }, () => ({
      x: rnd(0, W), y: rnd(0, H), r: rnd(30, Math.max(60, Math.min(W, H) * 0.14)), a: rnd(0.025, 0.06),
      hue: Math.random() < 0.6 ? [255, 90, 120] : [255, 180, 130], vx: rnd(-5, 5), vy: rnd(-4, 4)
    }));
  }

  function spawnPetal(hx, hy, R, burst) {
    falling.push({
      x: hx + rnd(-R * 0.6, R * 0.6), y: hy + rnd(-R * 0.2, R * 0.3),
      vx: rnd(-14, 14) + (burst ? rnd(-40, 40) : 0), vy: rnd(14, 28) + (burst ? rnd(-30, 5) : 0),
      rot: rnd(0, TAU), vr: rnd(-1.2, 1.2), flip: rnd(0, TAU), vf: rnd(1.2, 2.6),
      s: R * rnd(0.2, 0.3), ph: rnd(0, TAU), life: 0
    });
  }

  function drawBackground(hx, hy, R, bloom) {
    const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, Math.max(W, H) * 0.85);
    g.addColorStop(0, '#2a0f1c'); g.addColorStop(0.45, '#15070f'); g.addColorStop(1, '#070307');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const b of bokeh) {
      const rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      rg.addColorStop(0, `rgba(${b.hue[0]},${b.hue[1]},${b.hue[2]},${b.a})`);
      rg.addColorStop(0.7, `rgba(${b.hue[0]},${b.hue[1]},${b.hue[2]},${b.a * 0.6})`);
      rg.addColorStop(1, `rgba(${b.hue[0]},${b.hue[1]},${b.hue[2]},0)`);
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    }
    if (bloom > 0) {
      const gl = ctx.createRadialGradient(hx, hy, 0, hx, hy, R * 3.2);
      gl.addColorStop(0, `rgba(255,70,105,${0.22 * bloom})`);
      gl.addColorStop(0.5, `rgba(255,70,105,${0.07 * bloom})`);
      gl.addColorStop(1, 'rgba(255,70,105,0)');
      ctx.fillStyle = gl; ctx.fillRect(hx - R * 3.2, hy - R * 3.2, R * 6.4, R * 6.4);
    }
  }

  // ---------- main loop ----------
  let start = performance.now();
  if (reduce) start -= 12000;
  let last = start, nextFall = 8, head = { x: 0, y: 0, R: 0 };

  function frame(now) {
    const t = (now - start) / 1000;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const R = Math.min(W * 0.28, H * 0.16);
    const cx = W / 2;
    const sway = reduce ? 0 : Math.sin(t * 0.7) * R * 0.07;
    const P = [
      { x: cx + R * 0.1, y: H + 12 },
      { x: cx - R * 0.55, y: H * 0.8 },
      { x: cx + R * 0.45 + sway * 0.4, y: H * 0.62 },
      { x: cx + sway, y: H * 0.46 }
    ];
    const grow = easeInOut(clamp(t / 2.4));
    const bloom = clamp((t - 2.4) / 4.2);
    const tip = bez(P, grow);
    const budScale = easeOut(clamp((t - 0.7) / 1.8));
    const Rcur = R * (0.42 * budScale + 0.58 * easeInOut(bloom));
    head = { x: tip.x, y: tip.y, R };

    drawBackground(tip.x, tip.y, R, easeInOut(bloom));

    // dust
    for (const d of dust) {
      if (!reduce) {
        d.y += d.vy * dt; d.x += (d.vx + Math.sin(t * 0.5 + d.ph) * 6) * dt;
        if (d.y < -10) { d.y = H + 10; d.x = rnd(0, W); }
      }
      const a = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * d.sp + d.ph));
      ctx.fillStyle = `rgba(255,214,200,${a})`;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
    }
    if (!reduce) for (const b of bokeh) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -b.r) b.x = W + b.r; if (b.x > W + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = H + b.r; if (b.y > H + b.r) b.y = -b.r;
    }

    // leaves behind stem
    const leaves = [[0.3, -1, 1.0], [0.47, 1, 0.9], [0.63, -1, 0.72]];
    leaves.forEach(([s, side, sz], i) => {
      if (grow < s) return;
      const lp = easeOut(clamp((t - (1.0 + i * 0.45)) / 1.6));
      const q = bez(P, s), a = bezTan(P, s);
      const ang = a + side * (1.12 + (reduce ? 0 : Math.sin(t * 0.8 + i * 1.7) * 0.06));
      drawLeaf(q.x, q.y, ang, R * 1.15 * sz, R * 0.38 * sz, lp);
    });

    drawStem(P, grow, R);
    if (budScale > 0) drawRose(tip.x, tip.y, Rcur, bloom, t);

    // falling petals
    if (!reduce && t > nextFall) { spawnPetal(tip.x, tip.y, R); nextFall = t + rnd(2.2, 4.2); }
    for (let i = falling.length - 1; i >= 0; i--) {
      const f = falling[i];
      f.life += dt;
      f.vy = Math.min(f.vy + 6 * dt, 42); f.vx *= 0.995;
      f.x += (f.vx + Math.sin(f.life * 1.4 + f.ph) * 18) * dt; f.y += f.vy * dt;
      f.rot += f.vr * dt; f.flip += f.vf * dt;
      if (f.y > H + 40) { falling.splice(i, 1); continue; }
      const fx = Math.cos(f.flip);
      const b = 0.7 + 0.35 * Math.abs(fx);
      const c = Math.cos(f.rot), s = Math.sin(f.rot);
      const sx = f.s * (0.15 + 0.85 * Math.abs(fx)) * 0.6, sy = f.s;
      ctx.setTransform(DPR * c * sx, DPR * s * sx, DPR * -s * sy, DPR * c * sy, DPR * f.x, DPR * f.y);
      ctx.globalAlpha = clamp(f.life / 0.6) * clamp((H + 40 - f.y) / 120);
      fillPetal(b, fx < 0);
      ctx.globalAlpha = 1;
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    if (!reduce) requestAnimationFrame(frame);
  }

  cv.addEventListener('pointerdown', () => {
    if (reduce) return;
    for (let i = 0; i < 6; i++) spawnPetal(head.x, head.y, head.R, true);
  });

  const l1 = document.getElementById('l1'), l2 = document.getElementById('l2'), l3 = document.getElementById('l3');
  if (reduce) { l1.classList.add('show'); l2.classList.add('show'); l3.classList.add('show'); }
  else {
    setTimeout(() => l1.classList.add('show'), 4600);
    setTimeout(() => l2.classList.add('show'), 6600);
    setTimeout(() => l3.classList.add('show'), 9000);
  }

  // keep "Hayırlı Cumalar" centred between the top line and the rose
  function placeCuma() {
    const R = Math.min(W * 0.28, H * 0.16);
    const roseTop = H * 0.46 - R * 0.72;
    const textBottom = l1.offsetTop + l1.offsetHeight;
    l3.style.setProperty('--cuma-y', ((textBottom + roseTop) / 2) + 'px');
  }

  window.addEventListener('resize', () => { resize(); placeCuma(); if (reduce) requestAnimationFrame(frame); });
  resize();
  placeCuma();
  if (document.fonts) document.fonts.ready.then(placeCuma);
  requestAnimationFrame(frame);
})();
</script>
